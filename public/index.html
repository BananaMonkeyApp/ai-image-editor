<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Editor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0a0a0a;
    color: #eee;
    min-height: 100vh;
    padding: 20px;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    margin-bottom: 30px;
    background: linear-gradient(90deg, #06f, #f0f);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-size: 2rem;
  }
  .lock-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
  }
  .lock-screen input {
    font-size: 2rem;
    padding: 15px 25px;
    background: #1a1a1a;
    border: 2px solid #333;
    color: #fff;
    border-radius: 10px;
    text-align: center;
    width: 200px;
    letter-spacing: 10px;
  }
  .lock-screen button {
    margin-top: 20px;
    padding: 12px 40px;
    font-size: 1rem;
    background: #06f;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }
  .lock-error { color: #f66; margin-top: 15px; }
  .main-app { display: none; }
  .main-app.active { display: block; }
  .card {
    background: #1a1a1a;
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 20px;
    border: 1px solid #2a2a2a;
  }
  .upload-area {
    border: 2px dashed #444;
    border-radius: 10px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.3s;
  }
  .upload-area:hover { border-color: #06f; }
  .upload-area input { display: none; }
  .preview {
    max-width: 100%;
    max-height: 400px;
    border-radius: 8px;
    margin-top: 15px;
    display: none;
  }
  .preview.active { display: block; margin: 15px auto; }
  label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #ccc;
  }
  input[type="text"], textarea, select {
    width: 100%;
    padding: 12px;
    background: #0f0f0f;
    border: 1px solid #333;
    color: #fff;
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 80px; }
  .preset-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 15px;
  }
  .preset-btn {
    padding: 12px;
    background: #222;
    border: 1px solid #333;
    color: #fff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.2s;
  }
  .preset-btn:hover { background: #06f; }
  .submit-btn {
    width: 100%;
    padding: 15px;
    font-size: 1.1rem;
    background: linear-gradient(90deg, #06f, #a0f);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    margin-top: 10px;
  }
  .submit-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .result-area {
    display: none;
    text-align: center;
  }
  .result-area.active { display: block; }
  .result-img {
    max-width: 100%;
    max-height: 500px;
    border-radius: 8px;
    margin: 15px auto;
    display: block;
  }
  .status {
    text-align: center;
    padding: 15px;
    margin: 15px 0;
    background: #1a1a1a;
    border-radius: 8px;
    color: #06f;
  }
  .error {
    background: #2a1010;
    color: #f66;
    padding: 15px;
    border-radius: 8px;
    margin: 15px 0;
    font-family: monospace;
    font-size: 0.85rem;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid #333;
    border-top-color: #06f;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    vertical-align: middle;
    margin-right: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .download-btn {
    padding: 10px 25px;
    background: #0a5;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 10px;
    font-size: 0.95rem;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🎨 AI Image Editor</h1>

  <!-- Lock screen -->
  <div class="lock-screen" id="lockScreen">
    <p style="margin-bottom: 20px; color: #999;">Enter access code</p>
    <input type="password" id="codeInput" maxlength="4" inputmode="numeric" pattern="[0-9]*" autofocus>
    <button onclick="checkCode()">Unlock</button>
    <p class="lock-error" id="lockError"></p>
  </div>

  <!-- Main app -->
  <div class="main-app" id="mainApp">

    <div class="card">
      <label>1. Upload Image</label>
      <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
        <p>📤 Click to select image</p>
        <p style="font-size: 0.85rem; color: #666; margin-top: 5px;">JPEG, PNG, WebP</p>
      </div>
      <img id="preview" class="preview" alt="Preview">
    </div>

    <div class="card">
      <label>2. Choose Preset or Custom Prompt</label>
      <div class="preset-row">
        <button class="preset-btn" onclick="setPrompt('Convert this photo to anime style, preserve pose and features')">🎨 Anime Me</button>
        <button class="preset-btn" onclick="setPrompt('Enhance sharpness and remove blur')">🔍 Sharpen</button>
        <button class="preset-btn" onclick="setPrompt('Apply professional studio lighting')">💡 Studio Light</button>
      </div>
      <textarea id="promptInput" placeholder="Or type your own prompt here..."></textarea>
    </div>

    <div class="card">
      <label>3. LoRA (Optional)</label>
      <select id="loraSelect">
        <option value="Photo-to-Anime">Photo-to-Anime (default)</option>
        <option value="Anime-V2">Anime-V2</option>
        <option value="Multiple-Angles">Multiple-Angles</option>
        <option value="Light-Migration">Light-Migration</option>
        <option value="Upscaler">Upscaler</option>
        <option value="Style-Transfer">Style-Transfer</option>
        <option value="Manga-Tone">Manga-Tone</option>
        <option value="Anything2Real">Anything2Real</option>
        <option value="Polaroid-Photo">Polaroid-Photo</option>
        <option value="Unblur-Anything">Unblur-Anything</option>
        <option value="Hyper-Realistic-Portrait">Hyper-Realistic-Portrait</option>
        <option value="Ultra-Realistic-Portrait">Ultra-Realistic-Portrait</option>
        <option value="Pixar-Inspired-3D">Pixar-Inspired-3D</option>
        <option value="Noir-Comic-Book">Noir-Comic-Book</option>
        <option value="Any-light">Any-light</option>
        <option value="Studio-DeLight">Studio-DeLight</option>
        <option value="Cinematic-FlatLog">Cinematic-FlatLog</option>
        <option value="Midnight-Noir-Eyes-Spotlight">Midnight-Noir-Eyes-Spotlight</option>
        <option value="Fal-Multiple-Angles">Fal-Multiple-Angles</option>
      </select>
    </div>

    <div class="card">
      <button class="submit-btn" id="submitBtn" onclick="submitEdit()">✨ Generate Edit</button>
    </div>

    <div class="status" id="status" style="display:none;">
      <span class="spinner"></span>
      <span id="statusText">Processing... this can take 20-60 seconds</span>
    </div>

    <div class="error" id="errorBox" style="display:none;"></div>

    <div class="card result-area" id="resultArea">
      <label>Result</label>
      <img id="resultImg" class="result-img" alt="Result">
      <button class="download-btn" onclick="downloadResult()">⬇️ Download</button>
    </div>

  </div>
</div>

<script>
let selectedImageBase64 = null;
let resultImageData = null;

function checkCode() {
  const code = document.getElementById("codeInput").value;
  if (code === "8700") {
    document.getElementById("lockScreen").style.display = "none";
    document.getElementById("mainApp").classList.add("active");
  } else {
    document.getElementById("lockError").textContent = "Wrong code";
    document.getElementById("codeInput").value = "";
  }
}

document.getElementById("codeInput").addEventListener("keypress", (e) => {
  if (e.key === "Enter") checkCode();
});

function handleFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    selectedImageBase64 = e.target.result;
    const preview = document.getElementById("preview");
    preview.src = selectedImageBase64;
    preview.classList.add("active");
  };
  reader.readAsDataURL(file);
}

function setPrompt(text) {
  document.getElementById("promptInput").value = text;
}

async function submitEdit() {
  if (!selectedImageBase64) {
    alert("Please select an image first");
    return;
  }
  const prompt = document.getElementById("promptInput").value.trim();
  if (!prompt) {
    alert("Please enter a prompt or select a preset");
    return;
  }
  const lora = document.getElementById("loraSelect").value;

  const btn = document.getElementById("submitBtn");
  const status = document.getElementById("status");
  const errorBox = document.getElementById("errorBox");
  const resultArea = document.getElementById("resultArea");

  btn.disabled = true;
  status.style.display = "block";
  errorBox.style.display = "none";
  resultArea.classList.remove("active");

  try {
    const response = await fetch("/api/edit", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-App-Code": "8700"
      },
      body: JSON.stringify({
        image: selectedImageBase64,
        prompt: prompt,
        lora: lora
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(JSON.stringify(data, null, 2));
    }

    resultImageData = data.image;
    document.getElementById("resultImg").src = data.image;
    resultArea.classList.add("active");
    status.style.display = "none";

  } catch (err) {
    status.style.display = "none";
    errorBox.style.display = "block";
    errorBox.textContent = "ERROR:\n" + err.message;
  } finally {
    btn.disabled = false;
  }
}

function downloadResult() {
  if (!resultImageData) return;
  const link = document.createElement("a");
  link.href = resultImageData;
  link.download = "edited_" + Date.now() + ".png";
  link.click();
}
</script>
</body>
</html>
